<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>صرف المعدات والأدوات</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0d1117;
      color: #c9d1d9;
      margin: 0;
      padding: 20px;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      width: 480px;
      max-width: 95%;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      padding: 20px;
      box-sizing: border-box;
    }

    .modal-header {
      border: 1px solid #1f6feb;
      background: rgba(31, 111, 235, 0.1);
      color: #58a6ff;
      padding: 10px 15px;
      border-radius: 8px;
      font-weight: bold;
      margin-bottom: 20px;
      text-align: center;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      color: #8b949e;
    }

    .required-asterisk {
      color: #f85149;
    }

    .form-control {
      width: 100%;
      padding: 10px 12px;
      background-color: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #c9d1d9;
      font-size: 13px;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-control:focus {
      border-color: #58a6ff;
    }

    select.form-control option {
      background-color: #161b22;
      color: #c9d1d9;
      padding: 8px;
    }

    /* تنسيق الخيارات في القائمة المنسدلة */
    select.form-control optgroup {
      background-color: #0d1117;
      color: #58a6ff;
      font-weight: bold;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 25px;
    }

    .btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
    }

    .btn-submit {
      background-color: #238636;
      color: #ffffff;
    }

    .btn-submit:hover {
      background-color: #2ea043;
    }

    .btn-cancel {
      background-color: #21262d;
      color: #c9d1d9;
      border: 1px solid #30363d;
    }

    .btn-cancel:hover {
      background-color: #30363d;
    }
  </style>
</head>
<body>

  <!-- نافذة صرف المعدة -->
  <div class="modal-overlay">
    <div class="modal-card">
      
      <!-- رأس النافذة -->
      <div class="modal-header">
        المواصفات: 1 | الحالة: تحتاج صيانه
      </div>

      <!-- نموذج البيانات مع إلغاء الإكمال التلقائي لمنع النافذة المنبثقة -->
      <form id="dispatchForm" autocomplete="off">
        
        <div class="form-group">
          <label>رقم أمر التشغيل / المشروع: <span class="required-asterisk">*</span></label>
          <input type="text" class="form-control" name="work_order" autocomplete="off" required placeholder="أدخل رقم أمر التشغيل أو بلا">
        </div>

        <div class="form-group">
          <label>اسم المسؤول عن الصرف: <span class="required-asterisk">*</span></label>
          <input type="text" class="form-control" name="issuer_name" autocomplete="off" required placeholder="أدخل اسم المسؤول">
        </div>

        <div class="form-group">
          <label>اسم المستلم / الورشة / الجهة: <span class="required-asterisk">*</span></label>
          <input type="text" class="form-control" name="recipient_name" autocomplete="off" required placeholder="أدخل اسم المستلم أو مركز الصيانة">
        </div>

        <!-- قائمة خيارات الصرف الشاملة -->
        <div class="form-group">
          <label>نوع / سبب الصرف والخروج: <span class="required-asterisk">*</span></label>
          <select class="form-control" name="dispatch_reason" autocomplete="off" required>
            <option value="" disabled selected>-- اختر سبب خروج / صرف المعدة --</option>
            
            <optgroup label="🛠️ عمليات الصيانة والخدمة">
              <option value="صيانة خارجية (ورشة خارجية)">🔧 صيانة خارجية (ورشة / وكيل)</option>
              <option value="صيانة دورية / معايرة">⚙️ صيانة دورية / معايرة</option>
              <option value="إصلاح عطل مفاجئ">🚨 إصلاح عطل مفاجئ</option>
            </optgroup>

            <optgroup label="🏗️ التشغيل والمشاريع">
              <option value="تصنيع مشروع">🔨 تصنيع مشروع</option>
              <option value="تصنيع عينة">🧪 تصنيع عينة</option>
              <option value="نقل إلى مشروع آخر / موقع آخر">🚚 نقل إلى موقع / مشروع آخر</option>
            </optgroup>

            <optgroup label="📋 استخدامات أخرى">
              <option value="إعارة مؤقتة">🔄 إعارة مؤقتة</option>
              <option value="حدث / Event">🎉 حدث / Event</option>
              <option value="تالف أو هالك">⚠️ تالف أو هالك (استبعاد)</option>
            </optgroup>
          </select>
        </div>

        <!-- أزرار التحكم -->
        <div class="modal-actions">
          <button type="submit" class="btn btn-submit">📤 تأكيد والصرف</button>
          <button type="button" class="btn btn-cancel">إلغاء</button>
        </div>

      </form>

    </div>
  </div>

</body>
</html>
