<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام تجلى | Tajalla</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-card {
            background-color: #121826;
            border-radius: 16px;
            padding: 40px 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            text-align: center;
            border: 1px solid #1e293b;
        }

        .login-title {
            font-size: 24px;
            font-weight: bold;
            color: #38bdf8;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .login-subtitle {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 24px;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 45px 14px 16px;
            border-radius: 10px;
            border: 1px solid #334155;
            background-color: #e0f2fe;
            color: #0f172a;
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
            text-align: center;
            letter-spacing: 2px;
        }

        .input-group input:focus {
            border-color: #0284c7;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.3);
        }

        .toggle-eye {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 18px;
            user-select: none;
            opacity: 0.7;
            transition: opacity 0.2s;
        }

        .toggle-eye:hover {
            opacity: 1;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: none;
            background-color: #0284c7;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .login-btn:hover {
            background-color: #0369a1;
        }

        .error-message {
            color: #ef4444;
            font-size: 14px;
            margin-top: 15px;
            min-height: 20px;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-title">
            🔒 نظام تجلى | Tajalla
        </div>
        <div class="login-subtitle">
            أدخل رمز المرور للوصول للنظام
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="input-group">
                <input type="password" id="pin-input" placeholder="••••••••" required>
                <span class="toggle-eye" onclick="togglePasswordVisibility()">👁️</span>
            </div>

            <button type="submit" class="login-btn">دخول / Login</button>
        </form>

        <div id="error-msg" class="error-message"></div>
    </div>

    <script>
        // الرمز المعتمد الجديد الخاص بك
        const CORRECT_PIN = "$Ark0820";

        function handleLogin(event) {
            event.preventDefault();
            const inputField = document.getElementById('pin-input');
            const errorMsg = document.getElementById('error-msg');
            const userEnteredPin = inputField.value.trim();

            if (userEnteredPin === CORRECT_PIN) {
                errorMsg.style.color = '#22c55e';
                errorMsg.innerText = 'تم تسجيل الدخول بنجاح!';
                
                // الانتقال للصفحة التالية بعد نجاح الدخول
                setTimeout(() => {
                    // يمكنك استبدال index.html بالصفحة الأساسية لنظامك
                    window.location.href = 'dashboard.html'; 
                }, 500);
            } else {
                errorMsg.style.color = '#ef4444';
                errorMsg.innerText = 'رمز المرور غير صحيح!';
            }
        }

        function togglePasswordVisibility() {
            const pinInput = document.getElementById('pin-input');
            if (pinInput.type === "password") {
                pinInput.type = "text";
            } else {
                pinInput.type = "password";
            }
        }
    </script>
</body>
</html>
