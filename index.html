<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>نظام إدارة المخزون والمعدات</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0d1117;
      color: #c9d1d9;
      margin: 0;
      padding: 20px;
    }

    /* تنسيق النصوص ثنائية اللغة */
    .bilingual-label {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .lang-ar {
      font-size: 14px;
      font-weight: 600;
      color: #c9d1d9;
    }

    .lang-en {
      font-size: 11px;
      color: #8b949e;
      margin-top: 2px;
      direction: ltr;
      text-align: left;
    }

    /* الجدول الرئيسي */
    .data-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      overflow: hidden;
    }

    .data-table th, .data-table td {
      padding: 12px 15px;
      text-align: center;
      border-bottom: 1px solid #30363d;
    }

    .data-table th {
      background-color: #21262d;
      color: #58a6ff;
    }

    /* الحالات */
    .status-badge {
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: bold;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
    }

    .status-available { background-color: rgba(46, 160, 67, 0.2); color: #3fb950; border: 1px solid #238636; }
    .status-low { background-color: rgba(210, 153, 34, 0.2); color: #d29922; border: 1px solid #9e6a03; }
    .status-out { background-color: rgba(248, 81, 73, 0.2); color: #f85149; border: 1px solid #da3633; }

    /* النوافذ المنبثقة */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.75);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      width: 480px;
      max-width: 95%;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      padding: 22px;
      box-sizing: border-box;
    }

    .modal-header {
      border: 1px solid #1f6feb;
      background: rgba(31, 111, 235, 0.1);
      color: #58a6ff;
      padding: 10px 15px;
      border-radius: 8px;
      font-weight: bold;
      margin-bottom: 20px;
      text-align: center;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      margin-bottom: 6px;
      display: block;
    }

    .required-asterisk {
      color: #f85149;
    }

    .form-control {
      width: 100%;
      padding: 10px 12px;
      background-color: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #c9d1d9;
      font-size: 13px;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-control:focus {
      border-color: #58a6ff;
    }

    select.form-control option {
      background-color: #161b22;
      color: #c9d1d9;
      padding: 8px;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 25px;
    }

    .btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .btn-submit {
      background-color: #238636;
      color: #ffffff;
    }

    .btn-submit:hover {
      background-color: #2ea043;
    }

    .btn-cancel {
      background-color: #21262d;
      color: #c9d1d9;
      border: 1px solid #30363d;
    }

    .btn-cancel:hover {
      background-color: #30363d;
    }
  </style>
</head>
<body>

  <!-- جدول عرض الخشب الطبيعي -->
  <h2>
    <span class="lang-ar">🌲 الخشب الطبيعي</span>
    <span class="lang-en">Solid Natural Wood</span>
  </h2>

  <table class="data-table">
    <thead>
      <tr>
        <th>
          <div class="bilingual-label">
            <span class="lang-ar">نوع الخشب</span>
            <span class="lang-en">Wood Type</span>
          </div>
        </th>
        <th>
          <div class="bilingual-label">
            <span class="lang-ar">الكمية بالتكعيب (cm³)</span>
            <span class="lang-en">Volume (cm³)</span>
          </div>
        </th>
        <th>
          <div class="bilingual-label">
            <span class="lang-ar">عدد الألواح</span>
            <span class="lang-en">Boards Count</span>
          </div>
        </th>
        <th>
          <div class="bilingual-label">
            <span class="lang-ar">موقع التخزين</span>
            <span class="lang-en">Storage Location</span>
          </div>
        </th>
        <th>
          <div class="bilingual-label">
            <span class="lang-ar">الحالة</span>
            <span class="lang-en">Status</span>
          </div>
        </th>
        <th>
          <div class="bilingual-label">
            <span class="lang-ar">الإجراءات</span>
            <span class="lang-en">Actions</span>
          </div>
        </th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>خشب زان</td>
        <td>150 cm³</td>
        <td>4 لوح</td>
        <td>مستودع A1</td>
        <td>
          <!-- تنبيه آلي: لأن عدد الألواح أقل من أو يساوي 5 -->
          <span class="status-badge status-low">
            <span>قارب على النفاد</span>
            <span class="lang-en">Running Low</span>
          </span>
        </td>
        <td>
          <button class="btn btn-submit" style="padding: 4px 8px; font-size: 12px; display: inline-flex;">
            <span>صرف</span>
            <span class="lang-en">Dispatch</span>
          </button>
        </td>
      </tr>
    </tbody>
  </table>

  <br><hr><br>

  <!-- نافذة صرف الخشب (مثال موحد للنماذج مع إيقاف الاقتراحات وإلزامية الحقول) -->
  <div class="modal-overlay">
    <div class="modal-card">
      
      <div class="modal-header">
        <div class="bilingual-label" style="align-items: center;">
          <span class="lang-ar">إذن صرف صنف</span>
          <span class="lang-en">Dispatch Voucher</span>
        </div>
      </div>

      <form id="dispatchForm" autocomplete="off">
        
        <div class="form-group">
          <label class="bilingual-label">
            <span class="lang-ar">رقم أمر التشغيل / المشروع: <span class="required-asterisk">*</span></span>
            <span class="lang-en">Work Order / Project No.:</span>
          </label>
          <input type="text" class="form-control" name="work_order" autocomplete="off" required>
        </div>

        <div class="form-group">
          <label class="bilingual-label">
            <span class="lang-ar">اسم المسؤول عن الصرف: <span class="required-asterisk">*</span></span>
            <span class="lang-en">Issuer Name:</span>
          </label>
          <input type="text" class="form-control" name="issuer_name" autocomplete="off" required>
        </div>

        <div class="form-group">
          <label class="bilingual-label">
            <span class="lang-ar">اسم المستلم / القسم: <span class="required-asterisk">*</span></span>
            <span class="lang-en">Recipient Name / Dept:</span>
          </label>
          <input type="text" class="form-control" name="recipient_name" autocomplete="off" required>
        </div>

        <div class="form-group">
          <label class="bilingual-label">
            <span class="lang-ar">عدد الألواح المراد صرفها: <span class="required-asterisk">*</span></span>
            <span class="lang-en">Boards Count To Dispatch:</span>
          </label>
          <input type="number" class="form-control" name="boards_count" autocomplete="off" required>
        </div>

        <div class="form-group">
          <label class="bilingual-label">
            <span class="lang-ar">الكمية بالتكعيب (cm³): <span class="required-asterisk">*</span></span>
            <span class="lang-en">Volume To Dispatch (cm³):</span>
          </label>
          <input type="number" step="any" class="form-control" name="volume_cm3" autocomplete="off" required>
        </div>

        <div class="form-group">
          <label class="bilingual-label">
            <span class="lang-ar">سبب / الغرض من الصرف: <span class="required-asterisk">*</span></span>
            <span class="lang-en">Dispatch Reason / Purpose:</span>
          </label>
          <select class="form-control" name="dispatch_reason" autocomplete="off" required>
            <option value="" disabled selected>-- اختر السبب / Select Reason --</option>
            <option value="تصنيع مشروع">🔨 تصنيع مشروع | Project Manufacturing</option>
            <option value="تصنيع عينة">🧪 تصنيع عينة | Sample Fabrication</option>
            <option value="إصلاح / صيانة">🛠️ إصلاح / صيانة | Repair / Maintenance</option>
            <option value="خرجت لموقع عمل / مشروع">🚚 خرجت لموقع عمل | Dispatched to Worksite</option>
            <option value="إعارة مؤقتة">🔄 إعارة مؤقتة | Temporary Loan</option>
            <option value="حدث / Event">🎉 حدث | Event Use</option>
            <option value="تالف أو هالك">⚠️ تالف أو هالك | Scrapped / Damaged</option>
          </select>
        </div>

        <!-- أزرار التحكم -->
        <div class="modal-actions">
          <button type="submit" class="btn btn-submit">
            <span class="lang-ar">تأكيد والصرف</span>
            <span class="lang-en">Confirm & Dispatch</span>
          </button>
          <button type="button" class="btn btn-cancel">
            <span class="lang-ar">إلغاء</span>
            <span class="lang-en">Cancel</span>
          </button>
        </div>

      </form>

    </div>
  </div>

</body>
</html>
