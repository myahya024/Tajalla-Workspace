<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام تجلي - تسجيل الدخول</title>

  <!-- مكتبة Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0b1120;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #ffffff;
    }

    .login-card {
      background-color: #172136;
      border: 1px solid #1e293b;
      border-radius: 16px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .header-title {
      font-size: 1.8rem;
      color: #38bdf8;
      font-weight: bold;
      margin-bottom: 0.2rem;
    }

    .header-subtitle {
      font-size: 1.2rem;
      color: #38bdf8;
      margin-bottom: 1rem;
      opacity: 0.9;
    }

    .header-desc {
      color: #94a3b8;
      font-size: 0.95rem;
    }

    .header-desc-en {
      color: #64748b;
      font-size: 0.85rem;
      margin-bottom: 2rem;
    }

    .form-container {
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    .input-group {
      position: relative;
      width: 100%;
    }

    .input-group input {
      width: 100%;
      padding: 0.9rem 1rem;
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #ffffff;
      font-size: 0.95rem;
      text-align: center;
      transition: border-color 0.2s;
    }

    .input-group input:focus {
      outline: none;
      border-color: #38bdf8;
    }

    .toggle-eye {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      font-size: 1.1rem;
    }

    .submit-btn {
      background-color: #38bdf8;
      color: #0f172a;
      border: none;
      border-radius: 8px;
      padding: 0.9rem;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s, color 0.2s;
      margin-top: 0.5rem;
    }

    .submit-btn:hover {
      background-color: #0284c7;
      color: #ffffff;
    }

    .error-msg {
      color: #ef4444;
      font-size: 0.85rem;
      display: none;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="header">
      <div class="header-title">🔒 نظام تجلي</div>
      <div class="header-subtitle">Tajalla System</div>
      <div class="header-desc">اختر طريقة الوصول للنظام</div>
      <div class="header-desc-en">Choose access method</div>
    </div>

    <!-- نموذج تسجيل الدخول بنفس الخانتين معاً -->
    <form id="loginForm" class="form-container">
      
      <!-- خانة البريد الإلكتروني (إجبارية) -->
      <div class="input-group">
        <input 
          type="email" 
          id="email" 
          placeholder="البريد الإلكتروني / Email" 
          required 
        />
      </div>

      <!-- خانة كلمة السر (إجبارية) -->
      <div class="input-group">
        <input 
          type="password" 
          id="password" 
          placeholder="كلمة السر / Password" 
          required 
        />
        <button type="button" class="toggle-eye" id="togglePassword">👁️</button>
      </div>

      <div id="errorMsg" class="error-msg"></div>

      <!-- زر الدخول -->
      <button type="submit" class="submit-btn" id="submitBtn">تسجيل الدخول</button>
    </form>
  </div>

  <script>
    // 1. إعداد Supabase Client (ضع بياناتك هنا)
    const SUPABASE_URL = 'https://YOUR_SUPABASE_URL.supabase.co';
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 2. التحكم في إظهار/إخفاء كلمة السر
    const passwordInput = document.getElementById('password');
    const togglePassword = document.getElementById('togglePassword');

    togglePassword.addEventListener('click', () => {
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
      togglePassword.textContent = type === 'password' ? '👁️' : '🙈';
    });

    // 3. التعامل مع عملية تسجيل الدخول
    const loginForm = document.getElementById('loginForm');
    const errorMsg = document.getElementById('errorMsg');
    const submitBtn = document.getElementById('submitBtn');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault(); // المتصفح سيتأكد تلقائياً من تعبئة الخانتين قبل التنفيذ

      const email = document.getElementById('email').value;
      const password = passwordInput.value;

      submitBtn.disabled = true;
      submitBtn.textContent = 'جاري التحقق...';
      errorMsg.style.display = 'none';

      // تسجيل الدخول عن طريق Supabase
      const { data, error } = await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password,
      });

      if (error) {
        errorMsg.textContent = 'خطأ في بيانات الدخول: ' + error.message;
        errorMsg.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'تسجيل الدخول';
      } else {
        alert('تم تسجيل الدخول بنجاح!');
        // يمكنك توجيه المستخدم لصفحة أخرى هنا:
        // window.location.href = '/dashboard.html';
      }
    });
  </script>
</body>
</html>
