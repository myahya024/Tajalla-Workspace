<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام تجلى - Tajalla System</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .password-wrapper {
      position: relative;
      width: 100%;
      margin-bottom: 15px;
    }
    .password-wrapper input {
      width: 100%;
      padding: 12px 45px 12px 15px !important;
      box-sizing: border-box;
    }
    .eye-btn {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      font-size: 20px;
      user-select: none;
      z-index: 10;
    }
  </style>
</head>
<body>

  <!-- شاشة تسجيل الدخول -->
  <div id="login-overlay" class="login-overlay">
    <div class="login-box">
      <h2>نظام تجلى</h2>
      <p>أدخل رمز الدخول للمتابعة</p>
      
      <div class="password-wrapper">
        <input type="password" id="pin-input" placeholder="****">
        <span id="eye-icon" class="eye-btn" onclick="togglePassword()">👁️</span>
      </div>
      
      <button onclick="checkPin()">دخول</button>
      <p id="login-error" class="error-msg" style="display:none; color: #ef4444; margin-top: 10px;">الرمز غير صحيح!</p>
    </div>
  </div>

  <!-- التطبيق الرئيسي -->
  <div id="main-app" style="display:none;">
    <header class="app-header">
      <h1>نظام إدارة تجلى</h1>
      <button onclick="logout()" class="btn-logout">خروج</button>
    </header>

    <main class="app-content">
      <section id="sec-home" class="app-section">
        <h2>القائمة الرئيسية</h2>
        <div class="cards-grid">
          <div class="card" onclick="alert('قسم المواد قيد التطوير')">📦 إدارة المواد</div>
          <div class="card" onclick="alert('سجل الحركات قيد التطوير')">📑 سجل الحركات</div>
        </div>
      </section>
    </main>
  </div>

  <!-- الكود المباشر للأمان والعين -->
  <script>
    const SECRET_PIN = "$Arkon1818$";

    function togglePassword() {
      const input = document.getElementById('pin-input');
      const icon = document.getElementById('eye-icon');
      
      if (input.type === 'password') {
        input.type = 'text';
        icon.textContent = '👁️‍🗨️';
      } else {
        input.type = 'password';
        icon.textContent = '👁️';
      }
    }

    function checkPin() {
      const input = document.getElementById('pin-input').value;
      const error = document.getElementById('login-error');

      if (input === SECRET_PIN) {
        localStorage.setItem('tajalla_session', 'active');
        document.getElementById('login-overlay').style.display = 'none';
        document.getElementById('main-app').style.display = 'block';
        error.style.display = 'none';
      } else {
        error.style.display = 'block';
      }
    }

    function logout() {
      localStorage.removeItem('tajalla_session');
      location.reload();
    }

    window.onload = function() {
      if (localStorage.getItem('tajalla_session') === 'active') {
        document.getElementById('login-overlay').style.display = 'none';
        document.getElementById('main-app').style.display = 'block';
      }
    };
  </script>
</body>
</html>
