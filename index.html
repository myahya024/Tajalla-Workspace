<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام تجلى - Tajalla System</title>
  <link rel="stylesheet" href="style.css">
  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* تنسيق زر العين بشكل دقيق وبدون تأخير */
    .password-wrapper {
      position: relative;
      width: 100%;
      margin-bottom: 15px;
    }
    .password-wrapper input {
      width: 100%;
      padding: 12px 45px 12px 15px !important;
      box-sizing: border-box;
    }
    .eye-btn {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      font-size: 20px;
      user-select: none;
      z-index: 10;
    }
  </style>
</head>
<body>

  <!-- شاشة تسجيل الدخول -->
  <div id="login-overlay" class="login-overlay">
    <div class="login-box">
      <h2>نظام تجلى</h2>
      <p>أدخل رمز الدخول للمتابعة</p>
      
      <div class="password-wrapper">
        <input type="password" id="pin-input" placeholder="****">
        <span id="eye-icon" class="eye-btn" onclick="togglePassword()">👁️</span>
      </div>
      
      <button onclick="checkPin()">دخول</button>
      <p id="login-error" class="error-msg" style="display:none; color: #ef4444; margin-top: 10px;">الرمز غير صحيح!</p>
    </div>
  </div>

  <!-- التطبيق الرئيسي (الواجهات الكاملة) -->
  <div id="main-app" style="display:none;">
    <header class="app-header">
      <h1>نظام إدارة تجلى</h1>
      <button onclick="logout()" class="btn-logout">خروج</button>
    </header>

    <main class="app-content">
      <!-- الشاشة الرئيسية -->
      <section id="sec-home" class="app-section">
        <h2>القائمة الرئيسية</h2>
        <div class="cards-grid">
          <div class="card" onclick="showSection('sec-materials')">📦 إدارة المواد</div>
          <div class="card" onclick="showSection('sec-transactions')">📑 سجل الحركات</div>
        </div>
      </section>

      <!-- قسم إدارة المواد الخام -->
      <section id="sec-materials" class="app-section" style="display:none;">
        <div class="section-header">
          <h2>📦 إدارة المواد الخام</h2>
          <button onclick="showHomeHub()" class="btn-back">⬅️ عودة للمصنع</button>
        </div>
        <div id="materials-container">
          <!-- يتم تحميل جدول المواد وتفاصيلها عن طريق الجافاسكريبت -->
        </div>
      </section>

      <!-- قسم سجل الحركات -->
      <section id="sec-transactions" class="app-section" style="display:none;">
        <div class="section-header">
          <h2>📑 سجل الحركات</h2>
          <button onclick="showHomeHub()" class="btn-back">⬅️ عودة للمصنع</button>
        </div>
        <div id="transactions-container">
          <table class="data-table">
            <thead>
              <tr>
                <th>#</th>
                <th>اسم المادة</th>
                <th>نوع الحركة</th>
                <th>الكمية</th>
                <th>التاريخ</th>
              </tr>
            </thead>
            <tbody id="transactions-table-body">
              <!-- يتم تحميل الحركات هنا تلقائياً -->
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <!-- استدعاء كافة ملفات المشروع والمكتبات -->
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/materials.js"></script>
  <script src="js/transactions.js"></script>

  <!-- كود زر العين الآمن وإدارة الدخول -->
  <script>
    function togglePassword() {
      const input = document.getElementById('pin-input');
      const icon = document.getElementById('eye-icon');
      
      if (input.type === 'password') {
        input.type = 'text';
        icon.textContent = '👁️‍🗨️';
      } else {
        input.type = 'password';
        icon.textContent = '👁️';
      }
    }

    // التحقق المباشر عند التحميل
    window.addEventListener('DOMContentLoaded', () => {
      if (typeof checkExistingSession === 'function') {
        checkExistingSession();
      }
    });
  </script>
</body>
</html>
