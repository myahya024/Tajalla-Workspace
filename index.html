<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام تجلى - Tajalla System</title>
  <link rel="stylesheet" href="style.css">
  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* تحسين شكل حقل كلمة المرور مع زر العين */
    .password-container {
      position: relative;
      display: inline-block;
      width: 100%;
      max-width: 300px;
      margin-bottom: 10px;
    }
    .password-container input {
      width: 100%;
      padding-left: 40px; /* مساحة لزر العين */
      box-sizing: border-box;
    }
    .toggle-eye {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      font-size: 18px;
      user-select: none;
    }
  </style>
</head>
<body>

  <!-- شاشة تسجيل الدخول -->
  <div id="login-overlay" class="login-overlay">
    <div class="login-box">
      <h2>نظام تجلى</h2>
      <p>أدخل رمز الدخول للمتابعة</p>
      
      <div class="password-container">
        <input type="password" id="pin-input" placeholder="****">
        <span id="eye-icon" class="toggle-eye" onclick="togglePasswordVisibility()">👁️</span>
      </div>
      
      <br>
      <button onclick="checkPin()">دخول</button>
      <p id="login-error" class="error-msg" style="display:none; color: red; margin-top: 10px;">الرمز غير صحيح!</p>
    </div>
  </div>

  <!-- التطبيق الرئيسي -->
  <div id="main-app" style="display:none;">
    <header class="app-header">
      <h1>نظام إدارة تجلى</h1>
      <button onclick="logout()" class="btn-logout">خروج</button>
    </header>

    <main class="app-content">
      <!-- الشاشة الرئيسية -->
      <section id="sec-home" class="app-section">
        <h2>القائمة الرئيسية</h2>
        <div class="cards-grid">
          <div class="card" onclick="showSection('sec-materials')">📦 إدارة المواد</div>
          <div class="card" onclick="showSection('sec-transactions')">📑 سجل الحركات</div>
        </div>
      </section>

      <!-- قسم المواد -->
      <section id="sec-materials" class="app-section" style="display:none;">
        <h2>إدارة المواد الخام</h2>
        <button onclick="showHomeHub()">⬅️ عودة للمصنع</button>
      </section>

      <!-- قسم الحركات -->
      <section id="sec-transactions" class="app-section" style="display:none;">
        <h2>سجل الحركات</h2>
        <button onclick="showHomeHub()">⬅️ عودة للمصنع</button>
      </section>
    </main>
  </div>

  <!-- استدعاء ملفات الجافاسكريبت المنفصلة -->
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script>
    // تشغيل التحقق من الجلسة عند تحميل الصفحة
    window.onload = checkExistingSession;
  </script>
</body>
</html>
